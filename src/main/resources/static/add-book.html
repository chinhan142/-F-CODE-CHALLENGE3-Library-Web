<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Nhập Sách Mới | Quản trị</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-5 shadow">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fas fa-home me-2"></i> Thư Viện</a>
    <div class="navbar-text">
      <a href="admin.html" class="btn btn-outline-info btn-sm">Quay lại Dashboard</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white p-3 text-center">
          <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i> THÊM SÁCH VÀO HỆ THỐNG</h4>
        </div>
        <div class="card-body p-4 bg-white">
          <form id="addBookForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Mã sách</label>
                <input type="text" id="bookId" class="form-control" placeholder="Ví dụ: B001" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Tên cuốn sách</label>
                <input type="text" id="bookName" class="form-control" placeholder="Nhập tên sách..." required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Tác giả</label>
                <input type="text" id="author" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Thể loại</label>
                <input type="text" id="category" class="form-control" placeholder="CNTT, Văn học..." required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Ngày xuất bản</label>
                <input type="date" id="publishDate" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Số lượng nhập</label>
                <input type="number" id="quantity" class="form-control" min="1" value="1" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold">URL Ảnh bìa</label>
              <input type="text" id="imageUrl" class="form-control" placeholder="https://...">
            </div>
            <hr>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg fw-bold">LƯU SÁCH</button>
              <a href="admin.html" class="btn btn-light text-muted">Hủy bỏ</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
