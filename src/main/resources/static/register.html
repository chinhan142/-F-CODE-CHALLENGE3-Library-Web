<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản | Thư Viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="image/5.jpg" width="45" height="45" style="border-radius: 50%;" class="me-2 object-fit-cover">
            <span class="fw-bold">QUẢN LÝ SÁCH</span>
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Đăng nhập</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-lg p-4">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white d-inline-block p-3 rounded-circle mb-3 shadow">
                        <i class="fas fa-user-plus fa-2x"></i>
                    </div>
                    <h3 class="fw-bold">Tạo tài khoản</h3>
                    <p class="text-muted small">Đăng ký để mượn hàng ngàn cuốn sách</p>
                </div>

                <form>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 bg-light" id="username" placeholder="Nhập username...">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 bg-light" id="password" placeholder="Nhập mật khẩu...">
                        </div>
                    </div>

                    <button type="button" onclick="handleRegister(event)" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm py-2">
                        ĐĂNG KÝ NGAY
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-0 text-muted small">Đã có tài khoản?</p>
                    <a href="login.html" class="text-primary fw-bold text-decoration-none">Quay lại Đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/register.js"></script>
</body>
</html>
