<!-- ===== CONTENT ADMIN ===== -->
<div class="container mt-5">

    <!-- TIÊU ĐỀ -->
    <h2 class="text-center mb-4">📊 DANH SÁCH NGƯỜI MƯỢN SÁCH</h2>

    <!-- BẢNG QUẢN LÝ MƯỢN SÁCH -->
    <div class="row mb-5">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">🔥 Top sách được mượn nhiều nhất</div>
                <div class="card-body">
                    <div id="summary-stats" class="d-flex flex-wrap gap-3">
                        <!-- JavaScript sẽ đổ các "Badge" thống kê vào đây -->
                        Đang tính toán số liệu...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4 justify-content-center">
        <div class="col-md-6">
            <label class="fw-bold">Chọn đầu sách để xem thống kê:</label>
            <select id="bookSelector" class="form-select border-primary" onchange="filterRecords()">
                <option value="ALL">--- Tất cả đầu sách ---</option>
            </select>
            <div id="statsInfo" class="mt-2 text-primary fw-bold"></div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Tên người mượn</th>
                <th>Tên sách</th>
                <th>Ngày mượn</th>
                <th>Hạn trả</th>
                <th>Trạng thái</th>
            </tr>
            </thead>
            <tbody id="borrow-history-body">

            </tbody>
        </table>
    </div>

    <!-- GHI CHÚ -->
    <div class="alert alert-warning mt-4">
        <strong>Admin lưu ý:</strong>
        Theo dõi các trường hợp <span class="badge bg-danger">Quá hạn</span> để xử lý phạt.
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
