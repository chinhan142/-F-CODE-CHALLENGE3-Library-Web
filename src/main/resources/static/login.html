<!-- Cấu trúc chung cho cả Login và Register -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập | Thư Viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<!-- Navbar giống index.html -->
<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-4">
            <div class="card border-0 shadow-lg p-4">
                <div class="text-center mb-4">
                    <img src="image/5.jpg" width="80" class="rounded-circle mb-3">
                    <h3 class="fw-bold">Đăng nhập</h3>
                </div>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Tên đăng nhập</label>
                        <input type="text" class="form-control form-control-lg" id="username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control form-control-lg" id="password">
                    </div>
                    <button onclick="handleLogin(event)" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">Đăng Nhập</button>
                </form>
                <p class="mt-4 text-center text-muted">
                    Chưa có tài khoản? <a href="register.html" class="text-decoration-none">Đăng ký ngay</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
